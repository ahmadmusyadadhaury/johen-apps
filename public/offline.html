<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0987F5">
        <meta name="color-scheme" content="dark">
    <title>Sedang Luring &mdash; Johen Application</title>
    <link rel="icon" type="image/png" href="/pwa-192x192.png">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background:
                radial-gradient(circle at 15% 15%, rgba(9, 135, 245, 0.2), transparent 34rem),
                radial-gradient(circle at 85% 85%, rgba(124, 58, 237, 0.16), transparent 30rem),
                #f8fafc;
        }

        main {
            width: min(100%, 30rem);
            padding: 2.5rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 1.5rem 4rem rgba(15, 23, 42, 0.12);
            text-align: center;
            backdrop-filter: blur(1rem);
        }

        img {
            display: block;
            width: 6rem;
            height: 6rem;
            margin: 0 auto 1.5rem;
            object-fit: contain;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.5rem, 6vw, 2rem);
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: #64748b;
            line-height: 1.7;
        }

        button {
            margin-top: 1.75rem;
            border: 0;
            border-radius: 0.875rem;
            padding: 0.875rem 1.25rem;
            background: #0987f5;
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0.75rem 1.5rem rgba(9, 135, 245, 0.25);
        }

        button:hover {
            background: #036bd1;
        }

        button:focus-visible {
            outline: 3px solid #bfdffe;
            outline-offset: 3px;
        }

        #status {
            display: block;
            width: fit-content;
            min-height: 1.5rem;
            margin: 1rem auto 0;
            color: #036bd1;
            font-size: 0.875rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                background: #07080f;
                color: #f8fafc;
            }

            body {
                background:
                    radial-gradient(circle at 15% 15%, rgba(9, 135, 245, 0.22), transparent 34rem),
                    radial-gradient(circle at 85% 85%, rgba(124, 58, 237, 0.18), transparent 30rem),
                    #07080f;
            }

            main {
                border-color: rgba(148, 163, 184, 0.16);
                background: rgba(15, 23, 42, 0.88);
                box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
            }

            p {
                color: #94a3b8;
            }
        }
    </style>
</head>
<body>
    <main>
        <img src="/logo.png" alt="">
        <div id="status" role="status" aria-live="polite">Koneksi terputus</div>
        <h1>Tidak ada koneksi</h1>
        <p>Halaman ini butuh koneksi ke server. Data yang belum pernah dimuat tidak bisa ditampilkan.</p>
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
    <script>
        const status = document.getElementById('status');

        function updateConnectionStatus() {
            status.textContent = navigator.onLine
                ? 'Jaringan kembali aktif'
                : 'Koneksi terputus';
        }

        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        updateConnectionStatus();
    </script>
</body>
</html>
